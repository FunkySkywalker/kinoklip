<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/png" href="{{root}}static/kinoklip-icon.png">
<script>try{var t=localStorage.getItem('kk-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="{{root}}css/site.css">
</head>
<body>
{{header}}
<main id="main">
{{body}}
</main>
{{footer}}
<script src="{{root}}js/site.js" defer data-root="{{root}}"></script>
</body>
</html>
