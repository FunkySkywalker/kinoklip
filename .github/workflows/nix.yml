name: Nix

# Checks the Nix flake (flake.nix): source build, release AppImage wrapper, smoke test.
on:
  workflow_dispatch:
  push:
    branches: [nix-flake] # TEMPORARY: removed when the flake is merged

permissions:
  contents: read

jobs:
  flake:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Flake check
        run: nix flake check --print-build-logs

      - name: Build from source
        run: nix build .#default --print-build-logs

      - name: Smoke test, source build
        run: |
          nix run nixpkgs#xvfb-run -- -a result/bin/kinoklip --version
          QT_QPA_PLATFORM=offscreen timeout 15 result/bin/kinoklip || test $? -eq 124

      - name: Build the AppImage wrapper
        run: nix build .#appimage --print-build-logs -o result-appimage

      - name: Smoke test, AppImage wrapper
        continue-on-error: true # needs user namespaces, which GitHub's Ubuntu may restrict
        run: |
          result-appimage/bin/kinoklip --version

      - name: Show the flake lock
        if: always()
        run: cat flake.lock
